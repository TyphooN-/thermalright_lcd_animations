[package]
name = "thermalright-lcd"
version = "0.1.0"
edition = "2021"
description = "Thermalright LCD Animations — Rust port"
license = "MIT"

[[bin]]
name = "thermalright-lcd"
path = "src/main.rs"

[dependencies]
hidapi = "2"
crossterm = "0.27"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
