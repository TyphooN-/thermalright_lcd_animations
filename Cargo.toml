[package]
name = "thermalright-lcd"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Thermalright LCD Animations — Rust port"
license = "MIT"

[[bin]]
name = "thermalright-lcd"
path = "src/main.rs"

[dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-static-hidraw"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
rand = { version = "0.10.2", default-features = false, features = ["thread_rng"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
